<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GitHub User Search</title>

  <!-- Stylish Font -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family:'Montserrat', sans-serif;
    }

    .container{
      width:390px;
      padding:30px;
      border-radius:25px;
      background:#111827;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
      text-align:center;
      border:2px solid #00f5d4;
    }

    h1{
      font-family:'Orbitron', sans-serif;
      color:#00f5d4;
      margin-bottom:25px;
      font-size:30px;
      letter-spacing:2px;
    }

    .search-box{
      display:flex;
      gap:10px;
      margin-bottom:20px;
    }

    input{
      flex:1;
      padding:12px;
      border:none;
      outline:none;
      border-radius:12px;
      background:#1f2937;
      color:#ffffff;
      font-size:15px;
    }

    input::placeholder{
      color:#9ca3af;
    }

    button{
      padding:12px 18px;
      border:none;
      border-radius:12px;
      background:#00f5d4;
      color:#111827;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
      font-size:15px;
    }

    button:hover{
      background:#00c2a8;
      transform:scale(1.05);
    }

    .profile{
      display:none;
      margin-top:20px;
      color:white;
    }

    .profile img{
      width:120px;
      height:120px;
      border-radius:50%;
      border:4px solid #00f5d4;
      margin-bottom:15px;
    }

    .profile h2{
      color:#00f5d4;
      margin-bottom:8px;
      font-size:24px;
      font-family:'Orbitron', sans-serif;
    }

    .profile p{
      color:#d1d5db;
      margin:8px 0;
      font-size:14px;
    }

    .stats{
      display:flex;
      justify-content:space-between;
      margin-top:20px;
      background:#1f2937;
      padding:15px;
      border-radius:15px;
    }

    .stats div{
      text-align:center;
      flex:1;
    }

    .stats h3{
      color:#00f5d4;
      font-size:22px;
    }

    .stats span{
      color:#9ca3af;
      font-size:13px;
    }

    .error{
      color:#ff4d6d;
      margin-top:10px;
      font-size:14px;
    }

    .view-btn{
      margin-top:20px;
      width:100%;
      background:#ff4d6d;
      color:white;
    }

    .view-btn:hover{
      background:#e63956;
    }

    a{
      text-decoration:none;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>GITHUB SEARCH</h1>

    <div class="search-box">

      <input type="text" id="username" placeholder="Enter username">

      <button onclick="getUser()">Search</button>

    </div>

    <div class="error" id="error"></div>

    <div class="profile" id="profile">

      <img id="avatar" src="" alt="Profile">

      <h2 id="name"></h2>

      <p id="bio"></p>

      <div class="stats">

        <div>
          <h3 id="followers"></h3>
          <span>Followers</span>
        </div>

        <div>
          <h3 id="following"></h3>
          <span>Following</span>
        </div>

        <div>
          <h3 id="repos"></h3>
          <span>Repos</span>
        </div>

      </div>

      <a id="profileLink" href="" target="_blank">
        <button class="view-btn">View Profile</button>
      </a>

    </div>

  </div>

  <script>

    async function getUser(){

      const username = document.getElementById("username").value;

      const profile = document.getElementById("profile");

      const error = document.getElementById("error");

      if(username === ""){
        error.innerText = "Please enter a username";
        profile.style.display = "none";
        return;
      }

      try{

        const response = await fetch(`https://api.github.com/users/${username}`);

        if(!response.ok){
          throw new Error("User not found");
        }

        const data = await response.json();

        document.getElementById("avatar").src = data.avatar_url;

        document.getElementById("name").innerText = data.name || data.login;

        document.getElementById("bio").innerText = data.bio || "No bio available";

        document.getElementById("followers").innerText = data.followers;

        document.getElementById("following").innerText = data.following;

        document.getElementById("repos").innerText = data.public_repos;

        document.getElementById("profileLink").href = data.html_url;

        profile.style.display = "block";

        error.innerText = "";

      }

      catch(err){

        error.innerText = err.message;

        profile.style.display = "none";

      }

    }

  </script>

</body>
</html>
